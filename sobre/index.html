<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Trajetória | Daniel Poubel</title>
    <meta name="description" content="Conheça a trajetória de Daniel Poubel, sua experiência em gestão e educação, formação em tecnologia e jornada no desenvolvimento de software.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script src="../js/trajectory.js" defer></script>
    <script src="../js/theme.js" defer></script>

</head>

<body>

    <header class="header">
        <nav class="navbar">

            <a class="logo" href="../index.html">
                <img
                    src="../assets/images/logo/logo-horizontal-dark.png"
                    alt="Daniel Poubel"
                >
            </a>

            <a href="../index.html" class="btn-secondary">
                ← Voltar
            </a>

        </nav>
    </header>

    <main>

        <section class="about">

            <div class="section-heading">
                <h2>Minha trajetória</h2>
                <p>Conhecimento que se transforma em soluções.</p>
            </div>
            
            <div class="about-stories">

                <!-- ONTEM -->
                <button class="story-card story-yesterday"
                        type="button"
                        aria-expanded="false">

                    <span class="story-title">ONTEM</span>

                    <span class="story-preview">
                        Uma trajetória construída com liderança, gestão e transformação.
                    </span>

                    <span class="story-full">
                        <strong>Liderando pessoas, organizando caminhos.</strong>
                        Minha trajetória profissional começou na educação pública,
                        onde construí mais de 15 anos de experiência em gestão,
                        liderança e desenvolvimento humano. Atuei na direção,
                        coordenação e organização de equipes, planejando ações,                       estruturando processos e conduzindo projetos. Essa experiência
                        fortaleceu minha capacidade analítica, visão estratégica e
                        habilidade para compreender problemas, organizar demandas
                        e transformar planejamento em resultados.
                    </span>

                </button>

                <!-- HOJE -->
                <button class="story-card story-today"
                        type="button"
                        aria-expanded="false">

                    <span class="story-title">HOJE</span>

                    <span class="story-preview">
                        Transformando experiência em tecnologia com visão estratégica.
                    </span>

                    <span class="story-full">
                        <strong>Transformando experiência em tecnologia com visão estratégica.</strong>
                        Formado em Análise e Desenvolvimento de Sistemas e mestre
                        pela Universidade Federal do Espírito Santo (UFES), direciono
                        minha trajetória para o desenvolvimento de software. Trabalho
                        com Python e exploro a criação de aplicações web, mobile,
                        games e automações. Uno conhecimentos técnicos à experiência
                        em gestão e processos para transformar requisitos em soluções
                        funcionais, organizadas, eficientes e sustentáveis, sempre
                        valorizando a experiência do usuário e a qualidade do código.
                    </span>

                </button>

                <!-- AMANHÃ -->
                <button class="story-card story-tomorrow"
                        type="button"
                        aria-expanded="false">

                    <span class="story-title">AMANHÃ</span>

                    <span class="story-preview">
                        Construindo tecnologias que antecipam necessidades.
                    </span>

                    <span class="story-full">
                        <strong>Construindo tecnologias que geram valor.</strong>
                        Meu objetivo é aprofundar minha atuação no desenvolvimento
                        de software e na arquitetura de soluções tecnológicas.
                        Quero construir sistemas inteligentes, escaláveis e seguros,
                        capazes de antecipar necessidades, otimizar processos e
                        responder a desafios reais. Busco evoluir continuamente,
                        explorar novas tecnologias e participar de projetos que
                        transformem ideias em produtos digitais consistentes,
                        inovadores e preparados para crescer.
                    </span>

                </button>

                <!-- PROPÓSITO -->
                <button class="story-card story-purpose"
                        type="button"
                        aria-expanded="false">

                    <span class="story-title">PROPÓSITO</span>

                    <span class="story-preview">
                        Tecnologia com significado, criatividade e impacto.
                    </span>

                    <span class="story-full">
                        <strong>Tecnologia com significado e impacto.</strong>
                        Acredito que desenvolver software vai além de escrever código:
                        significa compreender necessidades, resolver problemas e
                        melhorar experiências. Meu propósito é unir tecnologia,
                        criatividade, conhecimento e visão estratégica para criar
                        soluções digitais que aproximem pessoas, simplifiquem rotinas,
                        otimizem processos e gerem valor para usuários e organizações.
                        Quero construir produtos que tenham utilidade, qualidade
                        e impacto positivo.
                    </span>

                </button>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Daniel Poubel. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
